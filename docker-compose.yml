version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: tushare
      POSTGRES_USER: tushare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tushare"]
      interval: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tushare:${DB_PASSWORD:-change-me}@db:5432/tushare
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      SCHEDULER_DAILY_SCREEN_TIME: "15:30"
      SCHEDULER_WEEKLY_ANALYSIS_DAY: fri
      SCHEDULER_WEEKLY_ANALYSIS_TIME: "16:00"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  pgdata:
